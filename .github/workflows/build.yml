name: build
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m pytest -q
      - run: pyinstaller smart_explorer.spec
      - name: Headless smoke test
        shell: bash
        env:
          SMART_EXPLORER_HEADLESS: "1"
          SMART_EXPLORER_PORT: "8765"
        run: |
          dist/SmartExplorer/SmartExplorer* &
          for i in $(seq 1 40); do
            sleep 2
            if curl -sf http://127.0.0.1:8765/api/status && curl -sf -o /dev/null http://127.0.0.1:8765/; then
              python scripts/smoke_formats.py http://127.0.0.1:8765; exit $?
            fi
          done
          echo "app did not respond within 80s"; exit 1
      - name: Package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # ditto, not shutil/zip: a .app contains symlinks (Python.framework
            # Versions/Current). Flattening them breaks the bundle and voids the
            # code signature, which macOS reports as "damaged and can't be opened".
            ditto -c -k --sequesterRsrc --keepParent dist/SmartExplorer.app SmartExplorer-macOS.zip
          else
            python -c "import shutil; shutil.make_archive('SmartExplorer-Windows','zip','dist','SmartExplorer')"
          fi
      - name: Verify macOS bundle survived packaging
        if: runner.os == 'macOS'
        run: |
          rm -rf verify && mkdir verify && ditto -x -k SmartExplorer-macOS.zip verify
          test -L verify/SmartExplorer.app/Contents/Frameworks/Python.framework/Versions/Current
          codesign -v verify/SmartExplorer.app
      - uses: actions/upload-artifact@v4
        with:
          name: SmartExplorer-${{ runner.os }}
          path: SmartExplorer-*.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: SmartExplorer-*.zip
