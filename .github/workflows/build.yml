name: build
# Push a tag vX.Y.Z (matching version.py) to build the Mac .dmg files and the
# Windows installer and publish them as a GitHub release. Pull requests that
# touch the app (code, page, icons, packaging), and "Run workflow" on the Actions
# tab, build and check the same files without publishing (download them from the
# run's artifacts). The church runs it on Windows, so every change is checked there.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "smart_explorer.spec"
      - "packaging/**"
      - "requirements.txt"
      - "**.py"
      - "static/**"
      - "assets/**"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest     # Apple Silicon (M1 and later)
            arch: apple-silicon
          - runner: macos-15-intel   # Intel Macs; GitHub offers this until Aug 2027
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m pytest -q
      - name: Read version
        run: echo "VERSION=$(python -c 'import version; print(version.APP_VERSION)')" >> "$GITHUB_ENV"
      - name: Tag must match version.py
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [ "${GITHUB_REF_NAME#v}" = "$VERSION" ] || { echo "Tag $GITHUB_REF_NAME does not match version.py ($VERSION)"; exit 1; }
      - run: pyinstaller --noconfirm smart_explorer.spec
      - name: Smoke test the app (starts, serves the page, reads PNG, HEIC and PDF, reaches OpenRouter)
        env:
          SMART_EXPLORER_HEADLESS: "1"
          SMART_EXPLORER_PORT: "8765"
          SSL_CERT_FILE: /nonexistent/cert.pem  # no build-machine certificates, as on a volunteer's Mac
          SSL_CERT_DIR: /nonexistent
        run: |
          "dist/Smart Explorer.app/Contents/MacOS/Smart Explorer" &
          for i in $(seq 1 40); do
            sleep 2
            if curl -sf http://127.0.0.1:8765/api/status && curl -sf -o /dev/null http://127.0.0.1:8765/; then
              python scripts/smoke_formats.py http://127.0.0.1:8765; exit $?
            fi
          done
          echo "app did not respond within 80s"; exit 1
      - name: Smoke test background renaming (--watch renames new files)
        run: python scripts/smoke_watch.py "dist/Smart Explorer.app/Contents/MacOS/Smart Explorer"
      - name: Build the .dmg (drag Smart Explorer to Applications)
        run: |
          DMG="SmartExplorer-$VERSION-mac-${{ matrix.arch }}.dmg"
          mkdir dmg
          # ditto, not cp: a .app contains symlinks (Python.framework Versions/Current).
          # Flattening them breaks the bundle and its signature ("damaged and can't be opened").
          ditto "dist/Smart Explorer.app" "dmg/Smart Explorer.app"
          ln -s /Applications dmg/Applications
          for try in 1 2 3; do  # hdiutil on CI runners is occasionally "Resource busy"
            hdiutil create -volname "Smart Explorer" -srcfolder dmg -ov -format UDZO "$DMG" && break
            sleep 5
          done
          test -f "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
      - name: Check the .dmg holds a working app
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/se "$DMG"
          test -L /tmp/se/Applications
          test -L "/tmp/se/Smart Explorer.app/Contents/Frameworks/Python.framework/Versions/Current"
          codesign -v "/tmp/se/Smart Explorer.app"
          hdiutil detach /tmp/se
      - name: Check an in-app update replaces an installed copy
        run: |
          mkdir -p /tmp/apps
          ditto "dist/Smart Explorer.app" "/tmp/apps/Smart Explorer.app"
          touch "/tmp/apps/Smart Explorer.app/Contents/old-version"
          python -c "import updater; print(updater.MAC_SCRIPT, end='')" > /tmp/update.sh
          cp "$DMG" /tmp/update.dmg  # the script deletes the .dmg it installed
          true & gone=$!; wait $gone  # the app has already quit
          sh /tmp/update.sh "$gone" /tmp/update.dmg "/tmp/apps/Smart Explorer.app" --no-open | tee /tmp/update.out
          grep -q "^updated" /tmp/update.out
          test ! -e "/tmp/apps/Smart Explorer.app/Contents/old-version"
          test ! -e "/tmp/apps/Smart Explorer.app.old" && test ! -e "/tmp/apps/Smart Explorer.app.new"
          codesign -v "/tmp/apps/Smart Explorer.app"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: SmartExplorer-*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m pytest -q
      - name: Read version
        shell: bash
        run: echo "VERSION=$(python -c 'import version; print(version.APP_VERSION)')" >> "$GITHUB_ENV"
      - name: Tag must match version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          [ "${GITHUB_REF_NAME#v}" = "$VERSION" ] || { echo "Tag $GITHUB_REF_NAME does not match version.py ($VERSION)"; exit 1; }
      - run: pyinstaller --noconfirm smart_explorer.spec
      - name: Smoke test the app (starts, serves the page, reads PNG, HEIC and PDF, reaches OpenRouter)
        shell: bash
        env:
          SMART_EXPLORER_HEADLESS: "1"
          SMART_EXPLORER_PORT: "8765"
          SSL_CERT_FILE: C:/nonexistent/cert.pem
          SSL_CERT_DIR: C:/nonexistent
        run: |
          "dist/Smart Explorer/Smart Explorer.exe" &
          for i in $(seq 1 40); do
            sleep 2
            if curl -sf http://127.0.0.1:8765/api/status && curl -sf -o /dev/null http://127.0.0.1:8765/; then
              python scripts/smoke_formats.py http://127.0.0.1:8765; exit $?
            fi
          done
          echo "app did not respond within 80s"; exit 1
      - name: Smoke test background renaming (--watch renames new files)
        shell: bash
        run: python scripts/smoke_watch.py "dist/Smart Explorer/Smart Explorer.exe"
      - name: Check "Start by itself when the computer starts" really starts it (Startup shortcut, as at sign-in)
        shell: bash
        run: python scripts/smoke_windows_startup.py "dist/Smart Explorer/Smart Explorer.exe"
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          iscc "/DAppVersion=$env:VERSION" packaging\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Check the installer installs, starts, updates and uninstalls
        shell: pwsh
        run: |
          $setup = "dist\SmartExplorer-$env:VERSION-windows-setup.exe"
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Smart Explorer"
          $exe = Join-Path $dir "Smart Explorer.exe"
          if (-not (Test-Path $exe)) { throw "The installer did not install $exe" }
          $env:SMART_EXPLORER_HEADLESS = "1"
          $env:SMART_EXPLORER_PORT = "8766"
          $app = Start-Process -FilePath $exe -PassThru
          $up = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 2
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8766/api/status | Out-Null; $up = $true; break } catch {}
          }
          Stop-Process -Id $app.Id -Force
          if (-not $up) { throw "The installed app did not start" }
          # An update from inside the app runs Setup over the install with /RELAUNCH=1,
          # which must open the app again (it inherits these settings).
          $env:SMART_EXPLORER_PORT = "8767"
          # Not -Wait: that also waits for what Setup starts, and the reopened app keeps running.
          $update = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CLOSEAPPLICATIONS", "/CURRENTUSER", "/RELAUNCH=1" -PassThru
          if (-not $update.WaitForExit(300000)) { throw "Setup did not finish updating" }
          $up = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 2
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8767/api/status | Out-Null; $up = $true; break } catch {}
          }
          Get-Process -Name "Smart Explorer" -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $up) { throw "Setup did not reopen the app after updating" }
          Start-Sleep -Seconds 2
          Start-Process -FilePath (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/SmartExplorer-*-windows-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
